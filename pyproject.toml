[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "firelens-bc"
version = "1.6.2"
description = "Evidence-bound RAG with bounded official British Columbia wildfire information"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.140.0",
  "httpx==0.28.1",
  "lxml==6.1.1",
  "numpy==2.5.1",
  "pdfplumber==0.11.10",
  "pydantic==2.13.4",
  "pypdf==6.15.0",
  "pyproj==3.7.2",
  "PyYAML==6.0.3",
  "shapely==2.1.2",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.161.5",
  "lxml-stubs==0.5.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.0",
  "types-PyYAML==6.0.12.20260724",
  "types-shapely==2.1.0.20260728",
]

[project.scripts]
firelens = "firelens.cli:main"

[tool.vercel.scripts]
build = "python scripts/prepare_vercel_build.py"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"firelens.review_workspace" = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
exclude = ["prototype"]
