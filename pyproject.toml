[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "firelens-bc"
version = "0.1.0"
description = "Evidence-bound static RAG for official British Columbia wildfire guidance"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.140.0",
  "httpx==0.28.1",
  "lxml==6.1.1",
  "numpy==2.5.1",
  "pdfplumber==0.11.10",
  "pydantic==2.13.4",
  "pypdf==6.14.2",
  "PyYAML==6.0.3",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
firelens = "firelens.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
