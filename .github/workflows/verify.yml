name: Verify pull request

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact PR head or push SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Confirm checkout is the exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.lock
          .venv/bin/python -m pip install --no-deps -e .
      - name: Install locked Node dependencies
        run: npm --prefix apps/web ci
      - name: Install Playwright Chromium
        run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Verify lockfiles and pinned actions
        run: |
          .venv/bin/python scripts/check_lockfiles.py
          .venv/bin/python scripts/check_actions_pinned.py
      - name: Validate documentation and repository map
        run: make docs-check
      - name: Run complete zero-cost verification
        run: make verify
      - name: Run ProductBench v2 deterministic offline contract
        run: make productbench-deterministic
      - name: Run source-aware conversation deterministic contract
        run: make source-aware-conversation
      - name: Run zero-cost EvalLab core engineering gate (not release qualification)
        env:
          EVAL_LAB_CI_DIR: ${{ runner.temp }}/firelens-eval-lab-core
        run: |
          PYTHONPATH=src:tests .venv/bin/python -m firelens_eval run \
            --suite core --output-dir "$EVAL_LAB_CI_DIR"
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          envelope = json.loads(
              (Path(os.environ["EVAL_LAB_CI_DIR"]) / "envelope.json").read_text()
          )
          identity = envelope.get("identity") or {}
          execution = envelope.get("execution") or {}
          adapters = envelope.get("adapters") or []
          required = {
              "claimbench_v2",
              "hard_probe_rc2_2",
              "productbench_offline",
              "source_aware_conversation",
          }
          observed = {item.get("adapter_id") for item in adapters}
          valid = (
              envelope.get("status") == "PASS"
              and envelope.get("qualification_role") == "zero_cost_engineering_evidence"
              and identity.get("dirty") is False
              and identity.get("changed_during_run") is False
              and execution.get("network_allowed") is False
              and execution.get("provider_calls_allowed") is False
              and execution.get("cost_ceiling_usd") == 0.0
              and observed == required
              and all(item.get("status") == "PASS" for item in adapters)
          )
          if not valid:
              raise SystemExit("EvalLab CI gate requires a clean, unchanged PASS envelope")
          PY
      - name: Reject generated-file drift
        run: git diff --exit-code
