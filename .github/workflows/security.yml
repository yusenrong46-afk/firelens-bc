name: Scheduled dependency security

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install application and pinned audit tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
          npm --prefix apps/web ci
      - name: Verify locks and action pins
        run: |
          python scripts/check_lockfiles.py
          python scripts/check_actions_pinned.py
      - name: Audit Python vulnerabilities
        run: pip-audit -r requirements.lock --format json --output python-audit.json
      - name: Audit npm vulnerabilities
        run: npm --prefix apps/web audit --audit-level=high --json > npm-audit.json
      - name: Check and record dependency licenses
        run: python scripts/report_dependency_licenses.py --output dependency-licenses.json
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit
          path: |
            python-audit.json
            npm-audit.json
            dependency-licenses.json
          if-no-files-found: warn
          retention-days: 30
