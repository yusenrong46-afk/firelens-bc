name: Build candidate evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: prototype/firelens-rag-ui/package-lock.json
      - name: Install locked application and audit tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.lock
          .venv/bin/python -m pip install --no-deps -e .
          .venv/bin/python -m pip install --disable-pip-version-check pip-audit==2.9.0
          npm --prefix prototype/firelens-rag-ui ci
          npx --prefix prototype/firelens-rag-ui playwright install --with-deps chromium
      - name: Verify locks, action pins, and candidate tests
        run: |
          .venv/bin/python scripts/check_lockfiles.py
          .venv/bin/python scripts/check_actions_pinned.py
          make verify
      - name: Write the commit-bound runtime candidate
        run: |
          .venv/bin/python scripts/write_runtime_candidate.py \
            --output config/runtime_candidate.v1.json \
            --commit "$GITHUB_SHA"
      - name: Capture raw dependency and license evidence
        run: |
          mkdir -p candidate-inputs
          .venv/bin/pip-audit -r requirements.lock --format json \
            --output candidate-inputs/python-audit.json || true
          npm --prefix prototype/firelens-rag-ui audit --json \
            > candidate-inputs/npm-audit.json || true
          .venv/bin/python scripts/report_dependency_licenses.py \
            --output candidate-inputs/dependency-licenses.json || true
      - name: Build and verify candidate evidence
        id: candidate
        continue-on-error: true
        run: |
          source_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          .venv/bin/python scripts/candidate_evidence.py build \
            --output-dir candidate-evidence \
            --commit "$GITHUB_SHA" \
            --generated-at "$source_date" \
            --builder-id "https://github.com/$GITHUB_REPOSITORY/actions/workflows/candidate.yml" \
            --invocation-id "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --python-audit candidate-inputs/python-audit.json \
            --npm-audit candidate-inputs/npm-audit.json \
            --licenses candidate-inputs/dependency-licenses.json
          .venv/bin/python scripts/candidate_evidence.py verify \
            --bundle candidate-evidence \
            --expected-commit "$GITHUB_SHA"
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-evidence-${{ github.sha }}
          path: candidate-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Enforce candidate security disposition
        if: always()
        env:
          EVIDENCE_OUTCOME: ${{ steps.candidate.outcome }}
        run: test "$EVIDENCE_OUTCOME" = success
