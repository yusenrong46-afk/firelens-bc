schema_version: firelens_release_gate_ledger.v1
release: V1.5-2
updated_at: "2026-08-08T13:44:37-07:00"
status_values: [not_run, pass, fail, waived]
waiver_policy: >
  A waiver must name the owner, rationale, expiry, and compensating control. No
  safety, semantic-holdout, sealed-retrieval, identity, critical accessibility,
  runtime-artifact-boundary, or promotion gate may be waived for V1.5-2.

gates:
  - id: G0-benchmark-ratification
    status: fail
    owner: product-owner
    artifact: docs/adr/0010-evaluation-dataset-roles-and-sealed-gates.md
    expiry: null
    observation: >
      V2 disposition remains open and the source-disjoint semantic holdout is
      still planned rather than an available identity-bound sealed role. The v2
      worktree now enforces execution-environment matching, UX cohort/device
      comparability, and raw deployment hash/content binding, but no eligible
      capture proves them. The tracked before-snapshot seal, exact
      before-to-seal-to-after Git ancestry, and semantic/retrieval owner-review
      recomputation are implemented, but no eligible seal exists. Development/
      sealed retrieval and semantic-holdout case-level recomputation are
      implemented but have no eligible real artifacts.
      The automated 30-row surface, CSS/layout, map-parity/privacy, emitted-asset,
      and lab-performance evidence path is implemented and has a diagnostic run;
      the automated protocol is still provisional. The frozen after-only manual
      frontend contract and validator now require three distinct named roles, 30
      exact atomic checks, five environment profiles across ten states, hash-bound
      retained evidence, candidate URL/commit identity, timestamp ordering, and
      zero open findings. No real named manual review has been performed. One
      uninterrupted repository verification passed on 2026-08-08 with 589 Python tests, 15
      frontend tests, 4 Sites tests, the production build, and all 18 Playwright
      flows. After the qualification verifier was hardened, the canonical static,
      type, 591-Python-test, frontend, build, and Sites stages passed again; the 18
      Playwright flows then passed separately after the sandbox-only localhost bind
      restriction was removed.

  - id: G0-before-baseline
    status: not_run
    owner: product-owner
    artifact: output/benchmark/v1_5_2/before/snapshot.json
    expiry: null
    observation: >
      Not run. The existing ignored snapshot uses legacy schema v1 and has no
      tracked digest attestation. Paid budget, named reviewers, real participant
