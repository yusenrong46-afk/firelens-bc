  - id: G2a-human-review-workspace
    status: not_run
    owner: evaluation-owner
    artifact: docs/protocols/V1_5_2_HUMAN_REVIEW_RUNBOOK.md
    expiry: null
    observation: >
      A nonqualifying backend scaffold now provides strict blind input imports,
      deterministic actor orders, isolated two-reviewer/adjudicator state,
      display acknowledgement, irreversible decisions, private hash-chained
      journals, per-event receipts, and input identity rechecks. Replay is
      read-only and storage rejects symlinks, hard links, root/path replacement,
      truncation, and receipt/journal count disagreement. A loopback-only API,
      per-actor private capability files, same-origin browser client, bounded
      request handling, same-actor open-case recovery, immutable nonqualifying
      final evidence export, verifier, preparation/resume CLI, and five-track
      human-review runbook now exist. Finalized evidence can now produce an
      immutable content-free agreement/adjudication analysis that recomputes
      percent agreement, Cohen's kappa where defined, disagreement/finding
      rosters, adjudicator alignment, and unsupported/unclear claim counts from
      the three actors' decision-event hashes. The verifier recomputes every
      metric and the output excludes questions, answers, source text, and notes;
      it remains explicitly nonqualifying. Preparation now rejects placeholder,
      duplicated, or model identities in human roles. A 47-case retrieval dry-run workspace was
      prepared and its reviewer-A context was reproduced over loopback without
      exposing rankings or capability contents. This remains wiring evidence,
      not human evidence. A coordinator-only session-status command now rechecks frozen inputs and
      all journal/receipt state before reporting content-free per-role progress;
      it never prints capability tokens or decision content. A fail-closed
      conversation/retrieval adapter now requires an independently authored
      storage attestation from a fourth named human, external final-head
      retention, zero adjudicated findings, and an atomic content-free package
      binding every actor/journal head plus source, export, analysis,
      attestation, sidecar, and summary hashes. Benchmark capture rejects the
      legacy single-reviewer sidecars without this manifest. No independent
      storage review, external anchor, qualifying package, confirmed V3
      retrieval set, or real named human session exists, so the gate remains
      not_run.

