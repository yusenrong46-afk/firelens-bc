  - id: G1-foundation
    status: not_run
    owner: engineering
    artifact: null
    expiry: null
    observation: >
      Durable sink selection and distributed-control publication remain. A
      content-free operational-event v2 schema now separates provider stages
      from provider model IDs and records status, validation disposition,
      evidence/claim/live counts, corpus, release, commit, and environment for a
      platform log drain; no durable drain/retention proof exists yet. Vercel
      function inclusion is now narrowed from data/** to the corpus, vector,
      conditional document context, repair registry, runtime configuration, and
      built client paths. Its build hook writes a commit/corpus/vector-bound
      runtime candidate. Docker now includes app.py, the shared runtime contract,
      repair registry, generator, and commit-bound runtime candidate; Render's
      documented RENDER_GIT_COMMIT build argument and runtime identity are wired.
      Document context remains conditional and is not required by the current
      metadata_context_v1 index. The shared runtime allowlist,
      standalone verifier, and required-after-only capture-owned inventory gate
      now exist and are hash-frozen by the benchmark. The gate scans isolated
      Vercel and Docker staged roots before and after all capture commands and
      recomputes required/prohibited paths, logical identity, and candidate-
      commit identity. It now rejects invalid vector bytes, loose corpus/vector
      schemas, fake entrypoints, hard links, artifact mutation, unreachable Vite
      entries, and side-effect/worker import omissions. Its assurance remains
      staged_logical_bundle: platform export provenance and observed runtime
      candidate identity are explicitly false, so release_qualified remains
      false. Static tests and candidate generation pass, but Docker is not
      installed locally, no real platform-export pair has passed the inventory,
      and no real raw platform rate-limit or rollback artifact has been captured.
      OpenRouter retries now parse numeric or HTTP-date Retry-After values, sleep
      outside the local semaphore, and fail immediately when the required delay
      cannot fit within the public deadline. The official place adapter now
      classifies sanitized timeout, HTTP, connection, invalid-data, not-found,
      and out-of-BC outcomes while allowing cancellation to propagate. Live map
      fetches use a bounded upstream semaphore and independent layers run
      concurrently without changing per-layer fail-closed behavior. Provider
      stages now have isolated local circuit state: final retryable or invalid-
      response operation failures open a bounded cooldown, one half-open probe
      is admitted, and a fully validated success resets only that stage. Public
      readiness exposes only a content-free configured/unprobed, available,
      degraded, or circuit-open state. Stage-local adaptive backpressure now
      halves capacity on 429, subtracts one on timeout/unavailability, respects
      a configured floor, and restores one permit after a configured run of
      validated successes. Retry sleeps and cancellation release capacity;
      malformed successful payloads do not reduce load capacity. A real
      provider canary and production pressure telemetry proof still remain.
      A manual-only, pinned candidate workflow now runs the full zero-cost
      verifier and packages CycloneDX 1.6 SBOM, in-toto/SLSA v1 provenance,
      dependency/license reports, benchmark/ledger copies, and a closed hash
      manifest. Its verifier rejects checkout drift, symlinks, changed or extra
      files, identity mismatches, vulnerable dependencies, and prohibited
      licenses. Live local scans initially found three Python vulnerabilities
      and four high npm vulnerabilities. Exact lock upgrades produced no known
      Python vulnerabilities and zero npm vulnerabilities; an ignored local
      candidate bundle then verified. This is local dirty-worktree evidence,
      not a CI artifact, signed attestation, container/infrastructure scan, or
      frozen release candidate.
      The new typed nearby endpoint binds coarse resolved location, radius,
      requested layers, viewport, freshness, unavailable layers, official
      fallbacks, and explicit bounded pagination. It returns at most 200 records
      per page without hiding the total matching roster. Per-feature and
      per-response geometry byte ceilings fail closed before caching. Live-
      qualification schema v2 now binds a canonical coarse-location Near Me
      request and retains pagination, viewport, returned-record, unavailable-
      layer, and official-fallback evidence for independent recomputation;
      production live SLO evidence remains. A separate hash-bound diagnostic
      harness now measures cold/cached p50/p95, availability, freshness
      coverage, stale-layer observations, and authoritative layer-update age by layer and three fixed BC
      regions. Its thresholds are deliberately null and it cannot qualify until
      owner ratification and scheduled production capture.

  - id: G2-evidence-corpus
    status: not_run
    owner: evidence-owner
    artifact: null
    expiry: null
    observation: Evidence compiler, repair decisions, source lifecycle, and novel-document gates remain.

  - id: G2a-human-review-workspace
    status: not_run
    owner: evaluation-owner
    artifact: docs/protocols/V1_5_2_HUMAN_REVIEW_RUNBOOK.md
    expiry: null
    observation: >
      A nonqualifying backend scaffold now provides strict blind input imports,
      deterministic actor orders, isolated two-reviewer/adjudicator state,
      display acknowledgement, irreversible decisions, private hash-chained
      journals, per-event receipts, and input identity rechecks. Replay is
      read-only and storage rejects symlinks, hard links, root/path replacement,
      truncation, and receipt/journal count disagreement. A loopback-only API,
      per-actor private capability files, same-origin browser client, bounded
      request handling, same-actor open-case recovery, immutable nonqualifying
      final evidence export, verifier, preparation/resume CLI, and five-track
      human-review runbook now exist. Finalized evidence can now produce an
      immutable content-free agreement/adjudication analysis that recomputes
      percent agreement, Cohen's kappa where defined, disagreement/finding
      rosters, adjudicator alignment, and unsupported/unclear claim counts from
      the three actors' decision-event hashes. The verifier recomputes every
      metric and the output excludes questions, answers, source text, and notes;
      it remains explicitly nonqualifying. Preparation now rejects placeholder,
      duplicated, or model identities in human roles. A 47-case retrieval dry-run workspace was
      prepared and its reviewer-A context was reproduced over loopback without
      exposing rankings or capability contents. This remains wiring evidence,
      not human evidence. A coordinator-only session-status command now rechecks frozen inputs and
      all journal/receipt state before reporting content-free per-role progress;
      it never prints capability tokens or decision content. A fail-closed
      conversation/retrieval adapter now requires an independently authored
      storage attestation from a fourth named human, external final-head
      retention, zero adjudicated findings, and an atomic content-free package
      binding every actor/journal head plus source, export, analysis,
      attestation, sidecar, and summary hashes. Benchmark capture rejects the
      legacy single-reviewer sidecars without this manifest. No independent
      storage review, external anchor, qualifying package, confirmed V3
      retrieval set, or real named human session exists, so the gate remains
      not_run.

  - id: G3-experiment-selection
    status: not_run
    owner: product-owner
