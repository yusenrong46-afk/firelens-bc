  - id: G4-product-ux
    status: not_run
    owner: product-owner
    artifact: null
    expiry: null
    observation: >
      Frontend and Near Me implementation plus real paired participant and named
      manual WCAG/product-safety evidence remain. The manual protocol/validator is
      implemented, and a private no-overwrite generator now emits the exact blank
      30-check/50-cell packet for three distinct named people without inventing
      outcomes. The UX v3 packet generator emits the frozen 12-person/60-attempt
      matrix; its validator derives completion from criterion/error codes, permits
      multiple access methods, applies the 120-second failed Near Me cap, and
      reports Wilson, worst-slice, and seeded bootstrap evidence. No real
      specialist, adjudicator, or participant bundle exists. The diagnostic
      initial automated surface run completed 30/30 rows and qualified 0/30. An
      accessibility-foundation diagnostic then qualified 18/30. The final local-
      vector map diagnostic passes all 30/30 automated rows, every functional
      journey, and both lab-performance profiles with zero direct third-party
      tile calls, axe A/AA findings, undersized text/targets, styled-control
      failures, or map/list parity failures. All ten fixture records remain
      available in the accessible list. The earlier 12 map-bearing failures came
      from direct OSM requests; that implementation defect is now removed by a
      locally bundled simplified Government of BC boundary with
      visible source/licence disclosure. The protocol remains provisional, the
      boundary is orientation context only, and UX access labels plus automated
      scans are not human accessibility or product-safety proof.

