services:
  - type: web
    name: firelens-bc
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FIRELENS_EMBEDDING_ZDR
        value: "required"
      - key: FIRELENS_RERANKING_ZDR
        value: "optional"
      - key: FIRELENS_GENERATION_ZDR
        value: "required"
      - key: FIRELENS_DATA_COLLECTION
        value: "deny"
      - key: FIRELENS_ALLOW_FALLBACKS
        value: "false"
      - key: FIRELENS_EMBEDDING_MODEL
        value: "openai/text-embedding-3-small"
      - key: FIRELENS_RERANK_MODEL
        value: "cohere/rerank-4-pro"
      - key: FIRELENS_GENERATION_MODEL
        value: "openai/gpt-5.6-luna"
      - key: FIRELENS_DEBUG
        value: "false"
      - key: FIRELENS_TRACE_CONTENT
        value: "false"
      - key: FIRELENS_RELEASE_VERSION
        value: "1.6.4"
