evidence_contract:
  path_prefix: evidence
  require_sha256: true
  require_byte_count: true
  require_every_item_referenced: true
  allowed_media_types:
    image/png: [.png]
    video/mp4: [.mp4]
    text/plain: [.txt, .log]
    text/markdown: [.md]
    application/json: [.json]
qualification_contract:
  required_atomic_status: pass
  open_findings_must_equal: 0
  require_distinct_people_for_all_roles: true
  require_exact_criterion_roster: true
  require_exact_atomic_check_roster: true
