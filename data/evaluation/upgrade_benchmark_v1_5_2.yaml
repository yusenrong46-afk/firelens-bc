tracks:
  zero_cost:
    - full repository verification
    - 105-case offline hard probe
    - manifest-complete frontend JavaScript, CSS, font, image, other, total-transfer, and unclassified-output budgets
    - exact 10-state by 3-viewport frontend surface protocol with retained screenshots, accessibility, CSS/layout, runtime, map/list parity, keyboard/privacy/history journeys, and exact 1+7 throttled performance samples
    - paired latency only under a matching execution-environment identity (v2 comparator enforced; eligible capture pending)
    - tracked before-snapshot seal with complete before-to-seal-to-after Git ancestry (v2 creation/verification enforced; eligible seal pending)
  network_no_model_cost:
    - official live-source qualification
  paid_development:
    - fixed 50-case development retrieval comparison (case-level rank/metric recomputation enforced)
  paid_qualified:
    - 105-case OpenRouter hard probe
    - required-after-only three-repetition sealed retrieval qualification (case-level rank/metric recomputation enforced)
  human:
    - paired 50-case claim-level semantic review
    - 47-case sealed-label owner review prerequisite
    - required-after-only source-disjoint semantic holdout (frozen development-registry overlap recomputation plus manifest/report/presentation-log/bundle hash binding and case-level review recomputation enforced; real artifacts pending)
    - paired five-task UX benchmark with cohort and device distribution comparability (v2 comparator enforced; real sessions pending)
    - frozen after-only named manual accessibility and wildfire product-safety review with exact environment/state coverage and retained evidence
  deployment:
    - anonymous preview qualification
    - distributed rate-limit proof backed by a retained raw artifact (v2 hash/content binding enforced; real proof pending)
    - rollback rehearsal backed by a retained raw artifact containing canonical smokes (v2 hash/content binding enforced; real proof pending)
    - capture-owned Vercel and Docker staged-artifact inventory and logical-identity gate, rerun before and after all benchmark commands

comparison_metrics:
  - key: verification_passed
    track: zero_cost
    value_type: boolean
    direction: higher_is_better
    comparison_mode: paired
    comparison_requirement: no_regression
    required_after: true
    gate_operator: eq
    gate_value: true

  - key: offline_hard_probe_pass_rate
    track: zero_cost
    value_type: number
    direction: higher_is_better
    comparison_mode: paired
    comparison_requirement: no_regression
    tolerance: {absolute: 0.0, relative: 0.0, rationale: "Deterministic pass rate has no noise allowance."}
    required_after: true
    gate_operator: gte
    gate_value: 1.0

  - key: offline_hard_probe_critical_failures
    track: zero_cost
    value_type: integer
    direction: lower_is_better
    comparison_mode: paired
    comparison_requirement: no_regression
    tolerance: {absolute: 0.0, relative: 0.0, rationale: "Critical failures are exact counts."}
    required_after: true
    gate_operator: lte
    gate_value: 0

  - key: offline_hard_probe_p95_ms
    track: zero_cost
    value_type: number
    direction: lower_is_better
    comparison_mode: paired
    comparison_requirement: no_regression
    tolerance: {absolute: 5.0, relative: 0.25, rationale: "Local controlled timing varies by machine load; larger changes are material."}
