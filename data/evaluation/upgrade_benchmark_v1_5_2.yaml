ux_tasks:
  - id: UX01
    name: Ask a preparedness question and inspect the exact source
    time_cap_seconds: 180
    critical_success: >
      The participant obtains an answer, opens its evidence, and correctly
      identifies which wording is source-backed.
    completion_criteria:
      - {id: UX01-C01, description: A bounded answer or explicit abstention is rendered.}
      - {id: UX01-C02, description: The participant opens the evidence view.}
      - {id: UX01-C03, description: The participant correctly identifies which wording is source-backed.}
    critical_errors:
      - {code: UX01-E01, description: Unsupported wording is treated as source-backed.}
      - {code: UX01-E02, description: Static evidence is treated as a current official wildfire status.}
  - id: UX02
    name: Find wildfires near a named BC community
    time_cap_seconds: 120
    critical_success: >
      The participant reaches the map, understands the search radius, and opens
      at least one official record without assuming that no result means safety.
    completion_criteria:
      - {id: UX02-C01, description: The participant reaches the Near Me map and record list.}
      - {id: UX02-C02, description: The participant correctly explains the search radius and freshness.}
      - {id: UX02-C03, description: The participant opens at least one official record.}
      - {id: UX02-C04, description: The participant does not interpret no-result output as confirmation of safety.}
    critical_errors:
      - {code: UX02-E01, description: No-result output is interpreted as confirmation of safety.}
      - {code: UX02-E02, description: An unofficial or stale record is treated as a current official status.}
  - id: UX03
    name: Distinguish an evacuation alert from an evacuation order
    time_cap_seconds: 120
    critical_success: >
      The participant identifies the difference and does not confuse stable
      definitions with a current local status.
    completion_criteria:
      - {id: UX03-C01, description: The participant correctly distinguishes an evacuation alert from an order.}
      - {id: UX03-C02, description: The participant does not treat a stable definition as a current local status.}
    critical_errors:
      - {code: UX03-E01, description: An evacuation alert and order are confused.}
      - {code: UX03-E02, description: A stable definition is treated as a current local status.}
  - id: UX04
    name: Interpret stale or partially unavailable live data
    time_cap_seconds: 120
    critical_success: >
      The participant notices freshness and unavailable-layer warnings and
      chooses an official source for confirmation.
    completion_criteria:
      - {id: UX04-C01, description: The participant notices the freshness or stale-state warning.}
      - {id: UX04-C02, description: The participant notices every unavailable or partial layer.}
      - {id: UX04-C03, description: The participant chooses an official source for confirmation.}
    critical_errors:
      - {code: UX04-E01, description: "Stale, partial, unavailable, or no-result output is interpreted as confirmation of safety."}
      - {code: UX04-E02, description: An unavailable layer is ignored when making a safety interpretation.}
  - id: UX05
    name: Recover from a provider or live-source failure
    time_cap_seconds: 120
    critical_success: >
      The participant understands that FireLens failed closed and can retry or
      continue to an official service without receiving an invented answer.
    completion_criteria:
      - {id: UX05-C01, description: The participant recognizes the provider or live-source failure state.}
      - {id: UX05-C02, description: The participant recognizes that no verified answer was produced.}
      - {id: UX05-C03, description: The participant selects retry or an official-source recovery path.}
    critical_errors:
      - {code: UX05-E01, description: Failed output is treated as a verified answer.}
      - {code: UX05-E02, description: Provider or live-source failure is interpreted as confirmation of safety.}
