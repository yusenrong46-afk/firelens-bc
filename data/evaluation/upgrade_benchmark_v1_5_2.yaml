schema_version: firelens_upgrade_benchmark_spec.v2
benchmark_id: firelens_v1_5_2
frozen_before_upgrade: false
description: >
  Provisional multi-track scorecard for the FireLens V1.5-2 upgrade. Paired
  development and permanent-regression metrics establish the before/after gap.
  Sealed retrieval, source-disjoint semantic holdout, preview, distributed
  rate limiting, and rollback remain required-after-only qualification gates.
  The recorded V2 mechanical-ranking exposure is resolved in ADR 0010 by
  permanently retiring V2 to regression use. It cannot be frozen until the
  fresh V3 sealed-retrieval set and semantic-holdout manifest exist. The v2
  worktree enforces execution-environment comparability, UX
  cohort/device comparability, raw deployment-artifact hash/content binding,
  semantic/retrieval owner-review recomputation, and a tracked immutable seal
  for the ignored before-snapshot artifact. After capture and comparison prove
  the committed ancestry chain from the before candidate through the unique
  seal-introducing commit to the after candidate. Development/sealed ranking
  aggregates are recomputed from retained rank IDs. Semantic-holdout qualification is
  recomputed from a schema-v3 manifest bound to a frozen development-exposure registry,
  a raw candidate report, and a canonical blinded, identity-bound randomized,
  append-only presentation-log/double-review/adjudication bundle. Separate
  accessibility, visual-state/CSS, Web Vitals, and runtime-artifact inventory
  gates are represented, including a frozen required-after-only manual
  accessibility and wildfire product-safety review contract.
  Semantic and retrieval review capture additionally requires the content-free
  blind-review qualification manifest produced only after independent storage
  review and external final-head retention.

