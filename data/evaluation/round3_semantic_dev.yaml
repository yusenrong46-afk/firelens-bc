    expect: accept
    quote: The source last updated the perimeter on 9 August 2026.
    claim: According to the source, the perimeter was last updated on 9 August 2026.
  - id: D-F11
    expect: accept
    quote: Wearing a well-fitted respirator outdoors is recommended during smoky hours.
    claim: During smoky hours, wearing a well-fitted respirator outdoors is recommended.
  - id: D-F12
    expect: accept
    quote: Store 3 litres of water per person per day for 72 hours.
    claim: For 72 hours, store 3 litres of water per person per day.
