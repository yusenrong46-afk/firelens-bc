schema_version: firelens.round3_semantic_dev.v1
origin: Round-3 development adversary authored before implementation completion
note: Not an independent held-out benchmark. Wording is intentionally outside ClaimBench and the imported Fable 71.
cases:
  - id: D-F01
    expect: accept
    quote: Maintain a 10 metre non-combustible zone measured from the outer wall.
    claim: Maintain a non-combustible zone of about 33 feet measured from the outer wall.
  - id: D-F02
    expect: accept
    quote: Fill a 500 millilitre bottle for each person in the vehicle.
    claim: Fill a 0.5 litre bottle for each person in the vehicle.
  - id: D-F03
    expect: accept
    quote: Keep no fewer than 8 metres between stacked lumber and the porch.
    claim: Keep at least 8 metres between stacked lumber and the porch.
  - id: D-F04
    expect: accept
    quote: FireSmart BC publishes structure-protection guidance for homeowners.
    claim: Structure-protection guidance for homeowners is published by FireSmart BC.
  - id: D-F05
    expect: accept
    quote: These records are a stale cache because the live refresh did not complete on 11 August 2026.
    claim: Because the live refresh did not complete on 11 August 2026, these records are a stale cache.
  - id: D-F06
    expect: accept
    quote: Residents are required to check in at the reception centre after evacuating.
    claim: Residents must check in at the reception centre after evacuating.
  - id: D-F07
    expect: accept
    quote: If a campfire prohibition is in effect, extinguish the fire completely before leaving the site.
    claim: Extinguish the fire completely before leaving the site if a campfire prohibition is in effect.
  - id: D-F08
    expect: accept
    quote: An evacuation alert means get prepared to leave; an evacuation order means leave now.
    claim: An evacuation alert means get prepared to leave, and an evacuation order means leave now.
