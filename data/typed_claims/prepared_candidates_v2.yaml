  exact_source_quote: Priority Zone 1 (1.5 to 10 metres from a structure or home)
    ¢ Avoid planting flammable trees and plants, such as cedar, spruce, juniper, pine
    and tall grasses
  surrounding_context: 'Priority Zone 1 (1.5 to 10 metres from a structure or home)

    ¢ Avoid planting flammable trees and plants, such as cedar, spruce,

    juniper, pine and tall grasses

    ¢ Keep lawns well-watered and mowed

    ¢ Move firewood piles, construction materials, storage sheds and

    other potentially combustible structures into Priority Zone 2

    Priority Zone 2 (10 to 30 metres from a structure or home)

    ¢ Measure the distance between the outermost branches of trees

    to ensure a minimum of three metres between them

    ¢ Remove small coniferous or evergreen trees that can act as a

    “ladder” for fire to reach treetops

    ¢ Remove branches within two metres of the ground to help stop

    surface fires from moving into treetops

    ¢ Clean up fallen branches, dry grasses and needles to eliminate

    potential surface fuels

    Priority Zone 3 (30 to 100 metres from a structure or home)'
