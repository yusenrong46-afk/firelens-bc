    FOLLOW INSTRUCTIONS

    The most important thing you can do is heed all evacuation alerts

    and orders and follow instructions from your band office, municipality,

    regional district or local authority. Trust in your preparedness and work

    your emergency plan.

    Natural gas safety

    Do NOT shut off your natural gas when you receive an evacuation order.

    If requested by emergency officials, FortisBC will turn off natural gas

    service as a precautionary measure, or if there is an immediate threat to

    infrastructure.

