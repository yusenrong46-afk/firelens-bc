  exact_source_quote: Watch for warning signs of extended anxiety and contact a medical
    professional or trusted community leader if they last more than two to four weeks
  surrounding_context: 'Psychological care:

    Fear and anxiety are natural reactions to stressful events and can stir

    up past traumas. To help yourself and your loved ones:

    ¢ Accept offers of help. Seek counselling or spiritual guidance

    ¢ Focus on positive memories and the skills you’ve used to get

    through other hard times

    ¢ Be aware of how children are reacting. Reassure them and

    encourage them to express themselves

    ¢ Give yourself and your loved ones permission to grieve

    ¢ Practice cultural or spiritual customs that bring you comfort

    With support, most people recover within a few weeks; however,

    some will need more time and help to heal. Watch for warning signs

    of extended anxiety and contact a medical professional or trusted

    community leader if they last more than two to four weeks:

    ¢ Trouble with eating and sleeping

    ¢ Feeling depressed or hopeless; showing low energy or crying often

    ¢ Being anxious and fearful

    ¢ Trouble focusing on daily activities'
