  replacement_text: 'PreparedBC

    Wildfire Preparedness Guide

    ¢ Frozen food: Discard food that’s thawed. If your freezer has been

    exposed to fire, or has been without power for more than three

    days, toss the contents

    ¢ Canned food: Tinned goods should be safe, unless the can has

    bulged, rusted or is badly dented. All undamaged canned goods

    should be washed and disinfected if they’ve been exposed

    to smoke. Food stored in glass jars exposed to heat should be

    thrown out as seals may have broken

    Psychological care:

    Fear and anxiety are natural reactions to stressful events and can stir

    up past traumas. To help yourself and your loved ones:

    ¢ Accept offers of help. Seek counselling or spiritual guidance

    ¢ Focus on positive memories and the skills you’ve used to get

    through other hard times

    ¢ Be aware of how children are reacting. Reassure them and

    encourage them to express themselves

    ¢ Give yourself and your loved ones permission to grieve

    ¢ Practice cultural or spiritual customs that bring you comfort

    People recover from trauma and stress at different times. Watch for

    warning signs of extended anxiety and contact a medical professional or

    trusted community leader if the following symptoms last more than two to four
    weeks:

    ¢ Trouble with eating and sleeping

    ¢ Feeling depressed or hopeless; showing low energy or crying often

    ¢ Being anxious and fearful

    ¢ Trouble focusing on daily activities

    16'
