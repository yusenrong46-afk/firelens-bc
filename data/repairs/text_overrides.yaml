  replacement_text: 'Wildfire Preparedness Guide

    ¢ Take down flammable curtains and window treatments

    ¢ Connect garden hoses and fill large containers with water, such as

    pools, hot tubs and garbage cans. This can assist firefighters and

    help slow advancing flames

    ¢ Ensure your house number is visible. This will help firefighters

    locate your home quickly

    ¢ Disconnect automatic garage door openers so doors can be

    opened by hand if you lose power

    Evacuation Order

    This means you are at risk and must leave IMMEDIATELY. On your way

    out, close doors and windows and turn on both interior and exterior

    lights so your home is visible to firefighters in heavy smoke.

    Follow all directions from officials and evacuate using the route(s)

    they''ve identified.

    An Emergency Support Services (ESS) reception centre may be opened

    for evacuated residents who are without access to other supports, such

    as insurance coverage or friends and family who can help. Services may

    include: food, lodging, clothing, emotional support, information about

    the crisis and family reunification.

    Evacuation Rescind

    Once officials determine the threat to life and safety has passed, the

    Evacuation Order will be rescinded. Continue to stay tuned for other

    possible Evacuation Alerts or Orders.

    TIP: Always keep your vehicle’s gas tank half-full

    or battery half-charged in case you need to

    evacuate on short notice.

